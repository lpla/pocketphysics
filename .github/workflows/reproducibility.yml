name: Reproducibility

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/reproducibility.yml"
      - "tools/repro/**"
      - "research/provenance/**"
      - "research/results/**"
  pull_request:
    paths:
      - ".github/workflows/reproducibility.yml"
      - "tools/repro/**"
      - "research/provenance/**"
      - "research/results/**"

permissions:
  contents: read

jobs:
  full-development-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Run reproducibility and in-ROM smoke suite
        env:
          REPEATS: "1"
          DESMUME_DURATION: "45"
          MELONDS_DURATION: "12"
        run: tools/repro/test_all.sh

      - name: Upload normalized benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inrom-smoke-${{ github.sha }}
          path: |
            research-artifacts/benchmarks/inrom-test/**
            research-artifacts/test/**
          if-no-files-found: warn
          retention-days: 14
